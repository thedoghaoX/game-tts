<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>遊戲文字即時朗讀</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
#video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #111; }
.overlay { position: fixed; z-index: 30; }
#top {
  top: calc(8px + env(safe-area-inset-top));
  left: 10px; right: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
#top button, #top label, #top a { pointer-events: auto; }
#status {
  background: rgba(0,0,0,0.82);
  padding: 10px 12px;
  border-radius: 14px;
  font-size: 16px;
  line-height: 1.35;
}
#statusDetail { margin-top: 4px; color: #c7c7cc; font-size: 14px; word-break: break-all; }
#statusDetail.error { color: #ff6b6b; }
#last { margin-top: 4px; color: #4ade80; font-size: 16px; word-break: break-all; }
#controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
button, .linkbtn {
  min-height: 48px;
  padding: 12px 16px;
  font-size: 17px;
  font-weight: 600;
  border-radius: 999px;
  border: none;
  background: #0a84ff;
  color: #fff;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}
button.secondary, .linkbtn { background: #3a3a3c; }
button.stop { background: #ff3b30; }
button:disabled { opacity: 0.6; }
label.threshold {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,0,0,0.72);
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 14px;
}
label.threshold input { width: 110px; }
#crop {
  position: fixed;
  border: 3px solid #0a84ff;
  background: rgba(10,132,255,0.15);
  touch-action: none;
  z-index: 20;
  cursor: move;
}
#crop .label {
  position: absolute;
  left: 8px; top: 6px;
  font-size: 13px;
  color: #fff;
  background: rgba(0,0,0,0.55);
  padding: 2px 6px;
  border-radius: 6px;
  pointer-events: none;
}
.handle {
  position: absolute;
  width: 28px; height: 28px;
  background: #fff;
  border: 3px solid #0a84ff;
  border-radius: 50%;
  touch-action: none;
}
.handle.nw { left: -14px; top: -14px; }
.handle.ne { right: -14px; top: -14px; }
.handle.sw { left: -14px; bottom: -14px; }
.handle.se { right: -14px; bottom: -14px; }
.handle.n { left: 50%; top: -14px; margin-left: -14px; }
.handle.s { left: 50%; bottom: -14px; margin-left: -14px; }
.handle.e { right: -14px; top: 50%; margin-top: -14px; }
.handle.w { left: -14px; top: 50%; margin-top: -14px; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="crop">
  <span class="label">拖曳移動，拉圓點調整大小</span>
  <i class="handle nw" data-handle="nw"></i>
  <i class="handle n" data-handle="n"></i>
  <i class="handle ne" data-handle="ne"></i>
  <i class="handle e" data-handle="e"></i>
  <i class="handle se" data-handle="se"></i>
  <i class="handle s" data-handle="s"></i>
  <i class="handle sw" data-handle="sw"></i>
  <i class="handle w" data-handle="w"></i>
</div>
<div id="top" class="overlay">
<div id="status">
  <div id="statusMain">點「開啟聲音」，再按「開始掃描」</div>
  <div id="statusDetail">裁切框預設在畫面下方，位置會記住</div>
  <div id="last"></div>
</div>
<div id="controls">
  <button id="unlock" type="button">開啟聲音</button>
  <button id="toggle" type="button">開始掃描</button>
  <button id="resetCrop" class="secondary" type="button">重置裁切</button>
  <button id="clearSpoken" class="secondary" type="button">清除已唸</button>
  <label class="threshold" title="裁切範圍裡有多少比例的畫面變了才重新辨識。電視閃爍就調高。">變化門檻 <input id="threshold" type="range" min="1" max="20" step="1" value="3"> <span id="thresholdValue">3</span>%</label>
  <a class="linkbtn" href="./test.html">離線測試</a>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
